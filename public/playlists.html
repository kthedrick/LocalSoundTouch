<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Playlists — LocalSoundTouch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .back-link {
      font-size: 0.75rem; color: #94a3b8; text-decoration: none;
      padding: 0.375rem 0.75rem; background: #1e293b;
      border-radius: 0.5rem; border: 1px solid #334155;
      transition: background 0.15s, color 0.15s;
    }
    .back-link:hover { background: #334155; color: #e2e8f0; }
    .page-header h1 { font-size: 0.95rem; font-weight: 600; color: #cbd5e1; }

    .station-section { margin-bottom: 2rem; }

    .station-header {
      display: flex; align-items: baseline; gap: 0.75rem;
      margin-bottom: 0.6rem; padding-bottom: 0.4rem;
      border-bottom: 1px solid #334155;
    }
    .station-name {
      font-size: 0.85rem; font-weight: 600; color: #e2e8f0;
    }
    .station-count {
      font-size: 0.7rem; color: #64748b;
    }
    .station-badge {
      font-size: 0.65rem; color: #22c55e; background: #14201a;
      border: 1px solid #166534; border-radius: 0.3rem;
      padding: 0.1rem 0.35rem;
    }

    .track-list { display: flex; flex-direction: column; gap: 0.3rem; }

    .track-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.45rem 0.65rem;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 0.5rem;
    }
    .track-num {
      font-size: 0.68rem; color: #475569;
      font-variant-numeric: tabular-nums;
      min-width: 1.4rem; text-align: right; flex-shrink: 0;
    }
    .track-info { flex: 1; min-width: 0; }
    .track-title { font-size: 0.78rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 0.68rem; color: #64748b; margin-top: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-apple { flex-shrink: 0; font-size: 0.65rem; color: #475569; }
    .track-apple.found { color: #22c55e; }

    .empty { text-align: center; color: #475569; font-size: 0.78rem; padding: 2.5rem 0; }
  </style>
</head>
<body>

<div class="page-header">
  <a href="/" class="back-link">← App</a>
  <h1>Local Playlists</h1>
  <div style="width:4rem"></div>
</div>

<div id="content"><div class="empty">Loading...</div></div>

<script>
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function load() {
    const r = await fetch('/ha/pandora-playlists');
    const d = await r.json();
    const playlists = d.playlists || [];
    const el = document.getElementById('content');

    if (!playlists.length) {
      el.innerHTML = '<div class="empty">No playlists yet — play a Pandora station to start collecting tracks.</div>';
      return;
    }

    el.innerHTML = playlists.map(pl => {
      const haMA = pl.maPlaylistId ? '<span class="station-badge">MA playlist</span>' : '';
      const tracks = pl.tracks || [];
      const trackRows = tracks.length === 0
        ? '<div class="empty" style="padding:0.75rem 0">No tracks yet</div>'
        : tracks.map((t, i) => `
          <div class="track-item">
            <div class="track-num">${i + 1}</div>
            <div class="track-info">
              <div class="track-title">${esc(t.title)}</div>
              <div class="track-artist">${esc(t.artist)}${t.album ? ' · ' + esc(t.album) : ''}</div>
            </div>
            <div class="track-apple ${t.appleUri ? 'found' : ''}">${t.appleUri ? '♫ AM' : '—'}</div>
          </div>`).join('');

      return `
        <div class="station-section">
          <div class="station-header">
            <span class="station-name">${esc(pl.station)}</span>
            <span class="station-count">${tracks.length} track${tracks.length !== 1 ? 's' : ''}</span>
            ${haMA}
          </div>
          <div class="track-list">${trackRows}</div>
        </div>`;
    }).join('');
  }

  load();
</script>
</body>
</html>
